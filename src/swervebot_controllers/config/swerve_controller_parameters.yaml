swerve_controller:
  wheel_names:
    read_only: true
    type: string_array
    description: Drive joint names; at least three, in the same order as all module arrays
  actuator_names:
    read_only: true
    type: string_array
    description: Steering joint names in module-array order
  wheel_command_interfaces:
    read_only: true
    type: string_array
    default_value:
    - velocity
    description: Command interface for the wheel joints
  wheel_state_interfaces:
    read_only: true
    type: string_array
    default_value:
    - velocity
    description: State interface for the wheel joints
  actuator_command_interfaces:
    read_only: true
    type: string_array
    default_value:
    - position
    description: Command interface for the actuator joints
  actuator_state_interfaces:
    read_only: true
    type: string_array
    default_value:
    - position
    - velocity
    description: State interface for the actuator joints
  enable_odom_tf:
    read_only: true
    type: bool
    default_value: true
    description: Publish odom to base_footprint transform
  odom_frame_id:
    read_only: true
    type: string
    default_value: odom
    description: Odometry frame id
  base_frame_id:
    read_only: true
    type: string
    default_value: base_footprint
    description: Base robot frame id
  cmd_vel_timeout:
    read_only: true
    type: double
    default_value: 0.5
    description: Maximum command age in monotonic seconds before stopping (up to 3600)
    validation:
      gt<>: 0.0
      lt_eq<>: 3600.0
  unsupported_command_policy:
    type: string
    default_value: stop
    description: Stop rejects nonplanar components; ignore discards them. Changes
      require a fresh Twist.
    validation:
      one_of<>:
      - - stop
        - ignore
  module_x:
    type: double_array
    read_only: true
    description: Steering pivot x coordinates in the base frame (m)
  module_y:
    type: double_array
    read_only: true
    description: Steering pivot y coordinates in the base frame (m)
  wheel_radii:
    type: double_array
    read_only: true
    description: Positive rolling radii in module order (m)
  wheel_offsets:
    type: double_array
    read_only: true
    description: Signed offset along local left normal to rolling direction (m)
  steering_continuous:
    type: bool_array
    read_only: true
    description: True for unwrapped continuous steering; false for bounded travel
  steering_min:
    type: double_array
    read_only: true
    description: Lower steering positions (rad); ignored for continuous joints
  steering_max:
    type: double_array
    read_only: true
    description: Upper steering positions (rad); ignored for continuous joints
  steering_velocity_limits:
    type: double_array
    read_only: true
    description: Positive per-module steering slew limits (rad/s)
  odom_publish_rate:
    type: double
    read_only: true
    default_value: 50.0
    description: Executor odometry publication rate (Hz)
    validation:
      gt<>: 0.0
      lt_eq<>: 1000.0
  command_epsilon:
    type: double
    read_only: true
    default_value: 1.0e-06
    description: Components smaller than this threshold are zero (SI units)
    validation:
      gt_eq<>: 0.0
  steering_feedback_tolerance:
    type: double
    read_only: true
    default_value: 0.001
    description: Allowed measured overshoot beyond bounded travel (rad)
    validation:
      gt_eq<>: 0.0
